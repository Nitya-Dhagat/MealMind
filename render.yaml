services:
  - type: web
    name: mealmind
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: NOMINATIM_USER_AGENT
        sync: false
